name: Notify issues of release

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify-issues:
    name: Notify issues of release
    runs-on: ubuntu-latest

    steps:
      - name: Notify issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          OWNER="${GH_REPO%%/*}"
          REPO="${GH_REPO#*/}"

          echo "Release: ${RELEASE_TAG}"

          #
          # Find the previous published release.
          #
          releases=$(gh api \
            --paginate \
            "repos/${GH_REPO}/releases?per_page=100")

          previous_tag=$(echo "${releases}" | jq -r --arg tag "${RELEASE_TAG}" '
            [
              .[]
              | select(.draft == false)
              | select(.tag_name != $tag)
            ]
            | sort_by(.published_at)
            | reverse
            | .[0].tag_name // empty
          ')

          if [[ -z "${previous_tag}" ]]; then
            echo "No previous release found."
            echo "Nothing to compare against; skipping."
            exit 0
          fi

          echo "Previous release: ${previous_tag}"

          #
          # Compare the two release tags.
          #
          # This gives us the commits in:
          #
          #   previous_tag..RELEASE_TAG
          #
          compare=$(gh api \
            "repos/${GH_REPO}/compare/${previous_tag}...${RELEASE_TAG}")

          #
          # Find every PR associated with every commit in the range.
          #
          # A PR may contain multiple commits, so deduplicate by PR number.
          #
          prs=$(echo "${compare}" |
            jq -r '.commits[].sha' |
            while read -r sha; do
              gh api \
                --paginate \
                "repos/${GH_REPO}/commits/${sha}/pulls?per_page=100" |
                jq -r '.[].number'
            done |
            sort -nu)

          if [[ -z "${prs}" ]]; then
            echo "No pull requests found in release range."
            exit 0
          fi

          echo "Pull requests in release:"
          echo "${prs}"

          #
          # Process each PR.
          #
          while read -r pr_number; do
            [[ -z "${pr_number}" ]] && continue

            echo
            echo "Processing PR #${pr_number}"

            #
            # Ask GitHub which issues this PR actually closes.
            #
            # This avoids having to parse things like:
            #
            #   Fixes #123
            #   Closes #456
            #   Resolves #789
            #
            # ourselves.
            #
            query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    number
                    url
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        url
                      }
                    }
                  }
                }
              }
            '

            result=$(gh api graphql \
              -f query="${query}" \
              -F owner="${OWNER}" \
              -F repo="${REPO}" \
              -F number="${pr_number}")

            echo "${result}" |
              jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[]?.number' |
              while read -r issue_number; do
                [[ -z "${issue_number}" ]] && continue

                echo "  Issue #${issue_number}"

                #
                # Use a unique marker so the workflow is idempotent.
                #
                marker="release-fix:${RELEASE_TAG}"

                #
                # Check existing comments for this marker.
                #
                existing=$(gh api \
                  --paginate \
                  "repos/${GH_REPO}/issues/${issue_number}/comments?per_page=100" |
                  jq -r --arg marker "${marker}" '
                    .[]
                    | select(.body | contains($marker))
                    | .id
                  ')

                if [[ -n "${existing}" ]]; then
                  echo "    Already notified; skipping."
                  continue
                fi

                #
                # Add the release notification.
                #
                body=$(cat <<EOF
          **Fixed in [${RELEASE_TAG}](${RELEASE_URL})**

          This issue was fixed by #${pr_number} and is included in this release.

          <!-- ${marker} -->
          EOF
                )

                gh api \
                  --method POST \
                  "repos/${GH_REPO}/issues/${issue_number}/comments" \
                  -f body="${body}"

                echo "    Comment added."
              done

          done <<< "${prs}"
